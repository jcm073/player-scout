[package]
name = "player-scout"
version = "0.1.0"
edition = "2024"
authors = ["jcm073 <jcmartinshg@gmail.com>"]
description = "Scouting, estatísticas avançadas e análise tática para esportes de raquete (Padel)"

[lib]
name = "player_scout"
path = "src/lib.rs"

[[bin]]
name = "player-scout"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[dependencies]
# Servidor HTTP & Roteamento (versão estável mais recente)
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-full"] }

# ORM Assíncrono Tokio para PostgreSQL
toasty = { version = "0.11.0", features = ["postgresql"] }

# Templates HTML Type-Safe Compilados (v0.16+)
askama = { version = "0.16.1" }

# Serialização, Tipagem & Erros
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.13", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cliente HTTP Assíncrono para OAuth2 / OpenID Connect (Google/OIDC)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Segurança e Hashing de Senhas (Argon2i - RustCrypto)
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Logs, Rastreamento & Variáveis de Ambiente
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# OpenAPI 3.1 & Swagger UI (Geração de Contratos para Clientes Móveis)
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

[dev-dependencies]
tokio-test = "0.4"

[profile.dev]
# Reduz o nível de símbolos de debug para apenas números de linha, acelerando I/O e linkagem
debug = 1
# Divide as informações de debug no Linux, acelerando a recriação do binário
split-debuginfo = "unpacked"
