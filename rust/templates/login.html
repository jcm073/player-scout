<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Scout — Login (Treinador &amp; Atleta)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center px-4 py-8 font-sans antialiased">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
    <!-- Cabeçalho -->
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-black text-lg">
        PS
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-white">Player Scout <span class="text-xs font-semibold px-2 py-0.5 ml-1 rounded bg-emerald-900/70 text-emerald-300">PADEL</span></h1>
        <p class="text-xs text-slate-400">Acesso exclusivo por E-mail · Segurança Argon2i</p>
      </div>
    </div>

    <!-- Formulário de Login por E-mail -->
    <form
      hx-post="/web/partials/auth/login"
      hx-target="#auth-feedback"
      hx-swap="innerHTML"
      class="space-y-4"
    >
      <div>
        <label class="block text-xs font-bold uppercase text-slate-300 mb-1.5" for="login-email">E-mail Cadastrado</label>
        <input
          id="login-email"
          type="email"
          name="email"
          required
          placeholder="atleta@playerscout.com.br"
          class="w-full min-h-[48px] px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-emerald-400 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-300 mb-1.5" for="login-password">Senha (12+ caracteres)</label>
        <input
          id="login-password"
          type="password"
          name="password"
          required
          minlength="12"
          placeholder="••••••••••••"
          class="w-full min-h-[48px] px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-emerald-400 focus:outline-none"
        />
      </div>

      <button
        type="submit"
        class="w-full min-h-[52px] rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-extrabold text-sm tracking-wide transition"
      >
        Entrar com E-mail
      </button>
    </form>

    <!-- Feedback HTMX de Login -->
    <div id="auth-feedback"></div>

    <!-- Divisor OAuth2 -->
    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="flex-shrink mx-3 text-[11px] uppercase font-bold text-slate-400">Ou entrar via OAuth2</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <!-- Provedores OAuth2 (Gmail, Microsoft Office, Instagram) -->
    <div class="grid grid-cols-1 gap-2.5">
      <a
        href="/api/v1/auth/oauth/google/authorize"
        class="min-h-[48px] px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-100 flex items-center justify-center gap-2 transition"
      >
        <span>📧</span> Continuar com Google (Gmail)
      </a>
      <a
        href="/api/v1/auth/oauth/microsoft/authorize"
        class="min-h-[48px] px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-100 flex items-center justify-center gap-2 transition"
      >
        <span>💼</span> Continuar com Microsoft Office
      </a>
      <a
        href="/api/v1/auth/oauth/instagram/authorize"
        class="min-h-[48px] px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-100 flex items-center justify-center gap-2 transition"
      >
        <span>📸</span> Continuar com Instagram
      </a>
    </div>

    <!-- Rodapé de Navegação -->
    <div class="pt-2 border-t border-slate-800 flex items-center justify-between text-xs">
      <a href="/web/register" class="font-bold text-emerald-400 hover:underline">Criar conta (Player / Coach)</a>
      <a href="/" class="text-slate-400 hover:text-slate-200">Voltar ao Dashboard</a>
    </div>
  </div>
</body>
</html>
