<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Scout — Login (Treinador &amp; Atleta)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center px-4 py-8 font-sans antialiased">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
    <!-- Cabeçalho -->
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-black text-lg">
        PS
      </div>
      <div>
        <h1 class="text-xl font-extrabold text-white">Player Scout <span class="text-xs font-semibold px-2 py-0.5 ml-1 rounded bg-emerald-900/70 text-emerald-300">PADEL</span></h1>
        <p class="text-xs text-slate-400">Acesso exclusivo por E-mail · Conexão Segura</p>
      </div>
    </div>

    <!-- Mensagem de Erro de Login (se houver) -->
    {% if let Some(err) = error %}
    <div class="p-4 rounded-xl bg-rose-950/80 border border-rose-700 text-rose-200 text-xs font-semibold">
      ❌ {{ err }}
    </div>
    {% endif %}

    <!-- Formulário de Login por E-mail -->
    <form
      action="/web/login"
      method="POST"
      class="space-y-4"
    >
      <div>
        <label class="block text-xs font-bold uppercase text-slate-300 mb-1.5" for="login-email">E-mail Cadastrado</label>
        <input
          id="login-email"
          type="email"
          name="email"
          required
          placeholder="atleta@playerscout.com.br"
          class="w-full min-h-[48px] px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-emerald-400 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-300 mb-1.5" for="login-password">Senha (12+ caracteres)</label>
        <div class="relative">
          <input
            id="login-password"
            type="password"
            name="password"
            required
            minlength="12"
            placeholder="••••••••••••"
            class="w-full min-h-[48px] pl-3.5 pr-12 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white focus:border-emerald-400 focus:outline-none"
          />
          <button
            type="button"
            onclick="togglePasswordVisibility('login-password', this)"
            title="Mostrar ou ocultar senha"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 p-2 text-slate-400 hover:text-slate-200 transition focus:outline-none text-base"
          >
            👁️
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="w-full min-h-[52px] rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-extrabold text-sm tracking-wide transition cursor-pointer"
      >
        Entrar com E-mail
      </button>
    </form>

    <!-- Divisor OAuth2 -->
    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="flex-shrink mx-3 text-[11px] uppercase font-bold text-slate-400">Ou entrar via OAuth2</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <!-- Provedores OAuth2 (Google, Microsoft Office, Instagram) -->
    <div class="grid grid-cols-1 gap-2.5">
      <a
        href="/web/auth/oauth/google/authorize"
        class="min-h-[48px] px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-100 flex items-center justify-center gap-2.5 transition group"
        aria-label="Continuar com Google"
      >
        <svg class="w-4 h-4 shrink-0 transition group-hover:scale-110" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
        </svg>
        <span>Continuar com Google (Gmail)</span>
      </a>
      <a
        href="/web/auth/oauth/microsoft/authorize"
        class="min-h-[48px] px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-100 flex items-center justify-center gap-2.5 transition group"
        aria-label="Continuar com Microsoft Office"
      >
        <svg class="w-4 h-4 shrink-0 transition group-hover:scale-110" viewBox="0 0 21 21">
          <path fill="#f25022" d="M1 1h9v9H1z"/>
          <path fill="#00a4ef" d="M1 11h9v9H1z"/>
          <path fill="#7fba00" d="M11 1h9v9h-9z"/>
          <path fill="#ffb900" d="M11 11h9v9h-9z"/>
        </svg>
        <span>Continuar com Microsoft Office</span>
      </a>
      <a
        href="/web/auth/oauth/instagram/authorize"
        class="min-h-[48px] px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-100 flex items-center justify-center gap-2.5 transition group"
        aria-label="Continuar com Instagram"
      >
        <svg class="w-4 h-4 shrink-0 fill-current text-pink-500 transition group-hover:scale-110" viewBox="0 0 24 24">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
        <span>Continuar com Instagram</span>
      </a>
    </div>

    <!-- Rodapé de Navegação -->
    <div class="pt-2 border-t border-slate-800 flex items-center justify-between text-xs">
      <a href="/web/register" class="font-bold text-emerald-400 hover:underline">Criar conta (Player / Coach)</a>
      <a href="/" class="text-slate-400 hover:text-slate-200">Voltar ao Dashboard</a>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    // Redirecionamento automático e imediato após autenticação bem-sucedida
    document.body.addEventListener('htmx:afterOnLoad', function (evt) {
      const redir = evt.detail.xhr && evt.detail.xhr.getResponseHeader('HX-Redirect');
      if (redir) {
        window.location.replace(redir);
      }
    });
    document.body.addEventListener('htmx:afterSwap', function (evt) {
      if (evt.detail.target && evt.detail.target.id === 'auth-feedback') {
        const link = document.getElementById('dashboard-redirect-link');
        if (link && link.href) {
          window.location.replace(link.href);
        }
      }
    });
  </script>
</body>
</html>
