<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Scout — Dashboard Analítico de Padel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX 4.x / Hipertexto Reativo -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <!-- Chart.js 4.4.9 (Versão Auditada sem CVEs conhecidos) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">
  <!-- Topbar Responsiva -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-black text-lg">
          PS
        </div>
        <div>
          <h1 class="text-lg font-extrabold tracking-tight text-white">Player Scout <span class="text-xs font-semibold px-2 py-0.5 ml-1 rounded bg-emerald-900/70 text-emerald-300">PADEL</span></h1>
          <p class="text-xs text-slate-400">Atleta: <strong class="text-slate-200">{{ player_name }}</strong> · Escopo Recursivo</p>
        </div>
      </div>

      <nav class="flex items-center gap-2">
        <a
          href="/?actor_id={{ actor_id }}&player_id={{ player_id }}{% if let Some(m) = match_id %}&match_id={{ m }}{% endif %}"
          class="min-h-[44px] px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold flex items-center"
        >
          📊 Dashboard Analítico
        </a>
        <a
          href="/web/court?actor_id={{ actor_id }}&player_id={{ player_id }}{% if let Some(m) = match_id %}&match_id={{ m }}{% endif %}"
          class="min-h-[44px] px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-bold flex items-center"
        >
          🎾 Modo Quadra (Touch-First)
        </a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <!-- Barra de Filtro Recursivo via HTMX -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 mr-2">Drill-Down Recursivo:</span>

        <button
          hx-get="/web/partials/analytics?actor_id={{ actor_id }}&player_id={{ player_id }}"
          hx-target="#analytics-panel"
          hx-swap="innerHTML"
          class="min-h-[44px] px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-white"
        >
          Carreira Completa
        </button>

        {% if let Some(m_id) = match_id %}
        <button
          hx-get="/web/partials/analytics?actor_id={{ actor_id }}&player_id={{ player_id }}&match_id={{ m_id }}"
          hx-target="#analytics-panel"
          hx-swap="innerHTML"
          class="min-h-[44px] px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-emerald-300"
        >
          Partida Atual
        </button>
        <button
          hx-get="/web/partials/analytics?actor_id={{ actor_id }}&player_id={{ player_id }}&match_id={{ m_id }}&set_number=1"
          hx-target="#analytics-panel"
          hx-swap="innerHTML"
          class="min-h-[44px] px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200"
        >
          Set 1
        </button>
        <button
          hx-get="/web/partials/analytics?actor_id={{ actor_id }}&player_id={{ player_id }}&match_id={{ m_id }}&set_number=2"
          hx-target="#analytics-panel"
          hx-swap="innerHTML"
          class="min-h-[44px] px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200"
        >
          Set 2
        </button>
        <button
          hx-get="/web/partials/compare?actor_id={{ actor_id }}&player_id={{ player_id }}&match_id={{ m_id }}&set_a=1&set_b=2"
          hx-target="#compare-panel"
          hx-swap="innerHTML"
          class="min-h-[44px] px-3.5 py-2 rounded-lg bg-indigo-600/90 hover:bg-indigo-500 text-xs font-bold text-white"
        >
          ⚖️ Comparar Set 1 vs Set 2
        </button>
        {% endif %}
      </div>
    </section>

    <!-- Painel Analítico Principal (Atualizável via HTMX) -->
    <section id="analytics-panel">
      {{ analytics_html|safe }}
    </section>

    <!-- Painel do Modo Comparativo Lado a Lado (Atualizável via HTMX) -->
    <section id="compare-panel">
      {{ compare_html|safe }}
    </section>
  </main>

  <script>
    function renderPadelRadar() {
      const canvas = document.getElementById('padelRadarChart');
      if (!canvas || typeof Chart === 'undefined') return;

      const existing = Chart.getChart(canvas);
      if (existing) existing.destroy();

      const dataValues = [
        parseFloat(canvas.dataset.serve || '0'),
        parseFloat(canvas.dataset.net || '0'),
        parseFloat(canvas.dataset.overhead || '0'),
        parseFloat(canvas.dataset.backcourt || '0'),
        parseFloat(canvas.dataset.wall || '0'),
        parseFloat(canvas.dataset.tactical || '0')
      ];

      new Chart(canvas, {
        type: 'radar',
        data: {
          labels: [
            'Saque & Recepção',
            'Domínio de Rede',
            'Jogo Aéreo (Smash/Víbora)',
            'Fundo & Globos',
            'Uso dos Vidros',
            'Maturidade Tática'
          ],
          datasets: [{
            label: 'Eficiência (%)',
            data: dataValues,
            backgroundColor: 'rgba(16, 185, 129, 0.22)',
            borderColor: 'rgb(16, 185, 129)',
            pointBackgroundColor: 'rgb(52, 211, 153)',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              min: 0,
              max: 100,
              ticks: { stepSize: 25, color: '#94a3b8', backdropColor: 'transparent' },
              grid: { color: 'rgba(148, 163, 184, 0.2)' },
              angleLines: { color: 'rgba(148, 163, 184, 0.2)' },
              pointLabels: { color: '#e2e8f0', font: { size: 11, weight: 'bold' } }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', renderPadelRadar);
    document.body.addEventListener('htmx:afterSwap', renderPadelRadar);
  </script>
</body>
</html>
